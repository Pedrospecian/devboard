name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Run tests
        working-directory: apps/api
        run: npm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/devboard_test
          JWT_SECRET: test-jwt-secret-with-at-least-32-characters
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-with-32-characters
          NODE_ENV: test

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Run tests
        working-directory: apps/web
        run: npm run test

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Build
        working-directory: apps/api
        run: npm run build

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test-web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001